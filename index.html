<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一建机电">
<meta name="theme-color" content="#0b1220">
<title>一建机电 · 随身学</title>
<style>
:root{
  --bg:#0b1220; --card:#151d2e; --card2:#1b2438; --line:#25314a;
  --text:#e8eefc; --muted:#8fa3c4; --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:linear-gradient(180deg,#111a2b,#0b1220);
  border-bottom:1px solid var(--line);flex:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.3px}
.chip{font-size:12px;color:#cfe0ff;background:#1c2b47;border:1px solid #2c3f61;border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip b{color:#7dd3fc;font-size:13px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 96px;overflow-anchor:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,22,37,.96);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:8px 0 7px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:9px 6px;
  border-radius:11px;font-size:13px;font-family:inherit}
.seg button.on{background:#1d3a63;border-color:#2f5d9e;color:#dbeafe;font-weight:600}
.bar{height:6px;background:#22304a;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee);width:0;transition:width .25s}
.qtag{font-size:11px;color:#9db4d8;letter-spacing:.4px}
.qtext{font-size:16px;line-height:1.65;margin:8px 0 14px;font-weight:500;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card2);
  border:1px solid var(--line);color:var(--text);border-radius:13px;padding:13px 14px;margin-bottom:9px;
  font-size:15px;line-height:1.5;font-family:inherit;transition:.15s}
.opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid #3a4c6d;display:flex;
  align-items:center;justify-content:center;font-size:12px;color:#a9bcdd;margin-top:1px}
.opt.sel{border-color:#3b82f6;background:#172a47}
.opt.ok{border-color:var(--ok);background:#10291c}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#04240f}
.opt.bad{border-color:var(--bad);background:#2a1417}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#2a0407}
.btn{background:var(--accent);color:#fff;border:0;border-radius:13px;padding:14px;font-size:15px;
  font-weight:600;width:100%;font-family:inherit}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.btn:disabled{opacity:.4}
.exp{background:#10243a;border:1px solid #1e3a5c;border-radius:13px;padding:13px 14px;margin-top:12px;font-size:14px;line-height:1.7}
.exp b{color:#7dd3fc}
.fb-ok{background:#10291c;border:1px solid #1f6b3a;color:#7ee2a8;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:15px;font-weight:600}
.fb-bad{background:#2a1417;border:1px solid #7f2d33;color:#ff9aa2;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:15px;font-weight:600}
.flash{background:linear-gradient(160deg,#1a2740,#141c2d);border:1px solid #2a3b58;border-radius:20px;
  min-height:300px;display:flex;flex-direction:column;justify-content:center;padding:26px 22px;text-align:center}
.flash .ft{font-size:12px;color:#7dd3fc;letter-spacing:2px;margin-bottom:14px}
.flash .fq{font-size:19px;line-height:1.7;font-weight:600;white-space:pre-wrap}
.flash .fa{font-size:15px;line-height:1.8;color:#c8d8f2;margin-top:18px;border-top:1px dashed #33496b;padding-top:16px;white-space:pre-wrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.item h3{margin:0 0 6px;font-size:15px;font-weight:600;line-height:1.5}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;margin-top:2px;color:#fff}
.stat span{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.8}
input[type=date]{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:10px;font-size:14px;font-family:inherit;width:100%}
.case-q{font-size:14px;line-height:1.8;white-space:pre-wrap;color:#d7e3f7}
.ansbox{background:#0e2136;border:1px solid #1d3d60;border-radius:12px;padding:12px;margin-top:10px;
  font-size:14px;line-height:1.8;color:#cfe3ff;white-space:pre-wrap}
details summary{color:#7dd3fc;font-size:14px;cursor:pointer;padding:4px 0;outline:none}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>一建机电 · 随身学</h1>
    <div class="chip">距考试 <b id="cd">--</b> 天</div>
  </div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="practice"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>练习</button>
  <button data-tab="cards"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 3h10"/></svg>卡片</button>
  <button data-tab="cases"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>案例</button>
  <button data-tab="wrong"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 9v4M12 16v.5"/></svg>错题</button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg>我的</button>
</nav>
<script>
"use strict";

/* ============ 题库 ============ */
const BANK = [
/* —— 技术 —— */
{id:"t01",ch:"技术",tag:"材料",type:"single",
 q:"低合金高强度结构钢 Q355 中，“355”表示（　）。",
 o:["抗拉强度最小值 355MPa","屈服强度最小值 355MPa","伸长率 35.5%","冲击吸收功 355J"],a:1,
 e:"Q 代表屈服强度，355 表示最小屈服强度 355MPa。"},
{id:"t02",ch:"技术",tag:"测量",type:"single",
 q:"机电工程中，用于测量两点间高差的仪器是（　）。",
 o:["水准仪","经纬仪","全站仪","激光铅垂仪"],a:0,
 e:"水准仪测高差；经纬仪测水平角和竖直角；全站仪可综合测角、测距、测高差。"},
{id:"t03",ch:"技术",tag:"测量",type:"single",
 q:"经纬仪的主要功能是（　）。",
 o:["测量两点间高差","测量水平角和竖直角","测量距离和坐标","测量平面度"],a:1,
 e:"经纬仪用于测量水平角、竖直角，配合其他工具可间接测距。"},
{id:"t04",ch:"技术",tag:"起重",type:"single",
 q:"吊装计算载荷 Qj＝K1·K2·Q 中，K1 是（　）。",
 o:["不均衡载荷系数","动载系数","安全系数","工作系数"],a:1,
 e:"K1 为动载系数，一般取 1.1；K2 为不均衡载荷系数，一般取 1.1～1.2。"},
{id:"t05",ch:"技术",tag:"起重",type:"single",
 q:"两台起重机抬吊同一设备时，每台起重机的载荷不应超过其额定起重量的（　）。",
 o:["60%","70%","80%","90%"],a:2,
 e:"多台起重机抬吊时，每台载荷不得超过额定起重量的 80%，并应统一指挥。"},
{id:"t06",ch:"技术",tag:"起重",type:"single",
 q:"桅杆式起重机缆风绳与地面的夹角宜为（　）。",
 o:["15°～30°","30°～45°","45°～60°","60°～75°"],a:1,
 e:"缆风绳与地面夹角以 30°～45° 为宜，过大拉力剧增，过小占地过大。"},
{id:"t07",ch:"技术",tag:"焊接",type:"single",
 q:"焊条型号 E4303 中，“43”表示（　）。",
 o:["熔敷金属抗拉强度最小值 430MPa","焊条直径 4.3mm","焊接电流 430A","适用母材厚度 43mm"],a:0,
 e:"E 表示焊条，43 表示熔敷金属抗拉强度最小值 430MPa，03 表示钛钙型药皮、交直流两用。"},
{id:"t08",ch:"技术",tag:"焊接",type:"single",
 q:"焊接线能量的计算公式是（　）。",
 o:["Q＝I·U·v","Q＝I·U／v","Q＝I·v／U","Q＝U·v／I"],a:1,
 e:"线能量 Q＝I·U／v，I 为焊接电流，U 为电弧电压，v 为焊接速度。"},
{id:"t09",ch:"技术",tag:"管道",type:"single",
 q:"管道系统液压试验的压力应为设计压力的（　）。",
 o:["1.15 倍","1.25 倍","1.5 倍","2.0 倍"],a:2,
 e:"液压试验压力为设计压力的 1.5 倍；气压试验为 1.15 倍。"},
{id:"t10",ch:"技术",tag:"管道",type:"single",
 q:"不锈钢管道水压试验时，水中氯离子含量不得超过（　）。",
 o:["25mg/L","50mg/L","100mg/L","200mg/L"],a:0,
 e:"氯离子超量会引起不锈钢点蚀和应力腐蚀，限值为 25mg/L（25ppm）。"},
{id:"t11",ch:"技术",tag:"管道",type:"single",
 q:"阀门安装前应做的试验是（　）。",
 o:["只做强度试验","只做严密性试验","强度试验和严密性试验","不做试验"],a:2,
 e:"每批抽 10% 且不少于 1 个，进行壳体强度试验和密封（严密性）试验。"},
{id:"t12",ch:"技术",tag:"电气",type:"single",
 q:"油浸变压器器身检查时，当环境相对湿度不大于 65%，器身露空时间不宜超过（　）。",
 o:["8h","12h","16h","24h"],a:2,
 e:"相对湿度≤65% 时不超过 16h；65%～75% 时不超过 12h。"},
{id:"t13",ch:"技术",tag:"防雷接地",type:"single",
 q:"扁钢与扁钢搭接焊接时，搭接长度应为扁钢宽度的（　），且不少于三面施焊。",
 o:["1 倍","2 倍","3 倍","6 倍"],a:1,
 e:"扁钢搭接≥2 倍宽度、三面施焊；圆钢搭接≥6 倍直径、双面施焊。"},
{id:"t14",ch:"技术",tag:"电梯",type:"single",
 q:"电梯安装施工前，安装单位应当履行的程序是（　）。",
 o:["直接开工","书面告知特种设备安全监督管理部门","先验收后告知","只需通知监理"],a:1,
 e:"特种设备安装、改造、修理的施工单位应当在施工前书面告知直辖市或设区的市级特种设备安全监督管理部门。"},
{id:"t15",ch:"技术",tag:"电梯",type:"single",
 q:"电梯安装完成后，监督检验应由（　）进行。",
 o:["建设单位","安装单位","特种设备检验机构","监理单位"],a:2,
 e:"电梯监督检验由具备资质的特种设备检验机构实施，合格后方可交付使用。"},
{id:"t16",ch:"技术",tag:"通风空调",type:"single",
 q:"洁净室高效过滤器安装前，系统应空吹（　）。",
 o:["2～4h","6～8h","12～24h","48h 以上"],a:2,
 e:"洁净室内装修完成、全面清扫擦拭后，系统空吹 12～24h 再安装高效过滤器。"},
{id:"t17",ch:"技术",tag:"临时用电",type:"single",
 q:"施工现场临时用电应采用（　）系统。",
 o:["TN-C","TN-S","TT","IT"],a:1,
 e:"采用 TN-S 接零保护系统，三级配电、两级保护，做到一机一闸一漏一箱。"},
{id:"t18",ch:"技术",tag:"临时用电",type:"single",
 q:"潮湿场所使用的漏电保护器，其额定动作电流和动作时间应为（　）。",
 o:["≤30mA、≤0.1s","≤50mA、≤0.2s","≤100mA、≤0.1s","≤300mA、≤0.3s"],a:0,
 e:"一般场所 ≤30mA、≤0.1s；潮湿或有腐蚀介质场所应选用防溅型，同样要求 ≤30mA、≤0.1s。"},
{id:"t19",ch:"技术",tag:"电动工具",type:"single",
 q:"Ⅱ 类手持电动工具的特点是（　）。",
 o:["必须接地","采用双重绝缘，不需接地","只能用于潮湿场所","必须装漏电保护器才可使用"],a:1,
 e:"Ⅱ 类工具为双重绝缘或加强绝缘，不需要接地（接零）。"},
{id:"t20",ch:"技术",tag:"设备安装",type:"single",
 q:"机械设备安装中，设备找正的依据是（　）。",
 o:["基础中心线","安装基准线（中心标板、标高基准点）","地脚螺栓位置","设备外形轮廓"],a:1,
 e:"安装基准线包括中心标板和标高基准点，是找正、找平、找标高的依据。"},
{id:"t21",ch:"技术",tag:"焊接",type:"single",
 q:"焊工中断受监察设备焊接工作超过（　），再从事焊接时应重新考试。",
 o:["3 个月","6 个月","12 个月","24 个月"],a:1,
 e:"中断 6 个月以上再施焊，应重新进行考试合格后方可上岗。"},
{id:"t22",ch:"技术",tag:"智能化",type:"single",
 q:"综合布线系统对铜缆链路进行认证测试时，主要测试参数是（　）。",
 o:["衰减和近端串扰","绝缘电阻和耐压","接地电阻和屏蔽","波长和频率"],a:0,
 e:"铜缆链路主要测衰减、近端串扰（NEXT）、回波损耗等；光缆测衰减和长度。"},

/* —— 管理 —— */
{id:"m01",ch:"管理",tag:"索赔",type:"single",
 q:"工期索赔成立的条件不包括（　）。",
 o:["延误原因不属于承包商责任","延误时间超过该工作的总时差","在合同约定时限内提出索赔","承包商因此增加了管理费"],a:3,
 e:"工期索赔三条件：非承包商原因、超过总时差、在约定时限内提出。费用索赔才涉及费用增加。"},
{id:"m02",ch:"管理",tag:"索赔",type:"single",
 q:"承包人应在知道或应当知道索赔事件发生后（　）内，向监理人递交索赔意向通知书。",
 o:["7 天","14 天","28 天","56 天"],a:2,
 e:"索赔意向通知书应在 28 天内发出，随后 28 天内递交正式索赔报告。"},
{id:"m03",ch:"管理",tag:"成本",type:"single",
 q:"某工程检查时 BCWP＝2400 万元，ACWP＝2800 万元，则（　）。",
 o:["成本节约 400 万元","成本超支 400 万元","进度超前 400 万元","无法判断"],a:1,
 e:"CV＝BCWP－ACWP＝－400 万元＜0，说明费用超支 400 万元。"},
{id:"m04",ch:"管理",tag:"进度",type:"single",
 q:"网络计划中，关键线路的特点是（　）。",
 o:["线路上工作总时差最大","线路上工作总时差为零","线路上工作持续时间最短","线路上工作数最多"],a:1,
 e:"关键线路上各工作的总时差为零，其总持续时间决定计算工期。"},
{id:"m05",ch:"管理",tag:"招标",type:"single",
 q:"依法必须招标的项目，评标委员会成员人数应为（　）。",
 o:["3 人以上单数","5 人以上单数","7 人以上单数","5 人以上双数"],a:1,
 e:"评标委员会由 5 人以上单数组成，其中技术、经济专家不少于成员总数的 2/3。"},
{id:"m06",ch:"管理",tag:"保修",type:"single",
 q:"电气管线、给排水管道、设备安装工程的最低保修期限为（　）。",
 o:["1 年","2 年","5 年","设计文件规定的合理使用年限"],a:1,
 e:"电气管线、给排水管道、设备安装和装修工程为 2 年；屋面防水、有防水要求的卫生间等为 5 年。"},
{id:"m07",ch:"管理",tag:"验收",type:"single",
 q:"单位工程竣工验收应由（　）组织。",
 o:["施工单位","监理单位","建设单位","设计单位"],a:2,
 e:"竣工验收由建设单位组织，施工、监理、设计、勘察等单位参加。"},
{id:"m08",ch:"管理",tag:"安全",type:"single",
 q:"超过一定规模的危险性较大的分部分项工程，专项施工方案应组织专家论证，专家人数不少于（　）。",
 o:["3 人","5 人","7 人","9 人"],a:1,
 e:"专家论证会由施工单位组织，专家 5 名以上，从专家库抽取，本项目参建各方人员不得以专家身份参加。"},
{id:"m09",ch:"管理",tag:"技术管理",type:"single",
 q:"施工组织设计应由（　）审批。",
 o:["项目经理","项目技术负责人","施工单位技术负责人","总监理工程师"],a:2,
 e:"施工组织设计由施工单位技术负责人审批并加盖公章，报总监理工程师审查。"},
{id:"m10",ch:"管理",tag:"验收",type:"single",
 q:"检验批质量验收应由（　）组织。",
 o:["专业监理工程师","总监理工程师","施工单位项目经理","建设单位项目负责人"],a:0,
 e:"检验批由专业监理工程师组织；分部工程由总监理工程师组织；单位工程由建设单位组织。"},
{id:"m11",ch:"管理",tag:"验收",type:"single",
 q:"分部工程质量验收应由（　）组织。",

{id:"t56",ch:"通风空调",tag:"防火",type:"single",

{id:"t57",ch:"通风空调",tag:"设备",type:"single",

{id:"t58",ch:"通风空调",tag:"设备",type:"single",

{id:"t59",ch:"通风空调",tag:"水系统",type:"single",

{id:"t60",ch:"通风空调",tag:"调试",type:"single",

{id:"t61",ch:"通风空调",tag:"风管",type:"single",

{id:"x23",ch:"通风空调",tag:"风管",type:"multi",
 q:"风管系统按工作压力可分为（　）。",
 o:["微压系统","低压系统","中压系统","高压系统"],a:[0,1,2,3],

{id:"x24",ch:"通风空调",tag:"风管",type:"multi",

{id:"x25",ch:"通风空调",tag:"风管",type:"multi",

{id:"x26",ch:"通风空调",tag:"调试",type:"multi",

{id:"x27",ch:"通风空调",tag:"水系统",type:"multi",

/* —— 第二节 机电工程起重技术 —— */
{id:"t62",ch:"技术",tag:"起重",type:"single",
 q:"下列起重机械中，属于臂架型起重机的是（　）。",
 o:["桥式起重机","门式起重机","塔式起重机","施工升降机"],a:2,
 e:"起重机分桥架型和臂架型：桥架型有桥式、门式；臂架型有塔式、流动式（汽车式、轮胎式、履带式）、桅杆式、悬臂式。"},
{id:"t63",ch:"技术",tag:"起重",type:"single",
 q:"关于汽车式起重机的特点，正确的是（　）。",
 o:["可带载行驶，转场最方便","行驶速度快、机动灵活，作业时须打支腿且不能带载行驶","必须铺设轨道才能运行","起重量最大，适用于千吨级设备"],a:1,
 e:"汽车式起重机以汽车底盘为行走机构，机动灵活、转移快；但吊装作业必须打好支腿，且不能带载行驶。"},
{id:"t64",ch:"技术",tag:"起重",type:"single",
 q:"与汽车式起重机相比，履带式起重机的主要特点是（　）。",
 o:["可带载行驶，但转场需用平板车运输","行驶速度快，可自行长途转场","作业时必须设置支腿","起重量小，只适用于小型设备"],a:0,
 e:"履带式起重机操作灵活、适应性强、起重量大、可带载行驶，但转场须用平板车运输；汽车式则行驶快、需支腿、不能带载行驶。"},
{id:"t65",ch:"技术",tag:"起重",type:"single",
 q:"塔式起重机的主要特点是（　）。",
 o:["起重量最大，可达千吨级","起升高度和幅度大、作业范围广，但安装拆卸复杂","只能用于室内吊装","无需固定基础，可随时移动"],a:1,
 e:"塔式起重机起升高度大、幅度大、工作效率高，但安装、拆卸工作量大，需设固定基础或附着装置。"},
{id:"t66",ch:"技术",tag:"起重",type:"single",
 q:"桅杆式起重机的特点是（　）。",
 o:["结构简单、起重量大、适应性强，但缆风绳多、装拆费工","机动灵活，可快速转场","不需缆风绳即可保持稳定","只适用于轻型构件吊装"],a:0,
 e:"桅杆式起重机结构简单、制作方便、起重量大、适应性强，但需大量缆风绳和地锚，占用场地大、装拆费工、效率低。"},
{id:"t67",ch:"技术",tag:"起重",type:"single",
 q:"直立桅杆的缆风绳数量不得少于（　）根。",
 o:["3","4","6","8"],a:2,
 e:"桅杆缆风绳不得少于 6 根，应对称布置，与地面夹角宜为 30°～45°。"},
{id:"t68",ch:"技术",tag:"起重",type:"single",
 q:"承载能力最大、适用于重型设备吊装的地锚形式是（　）。",
 o:["活动式地锚","半埋式地锚","全埋式地锚","利用建筑物柱脚"],a:2,
 e:"全埋式地锚埋设深、承载能力大，适用于大型、重型设备吊装；半埋式用于中型；活动式用于小型临时吊装。"},
{id:"t69",ch:"技术",tag:"起重",type:"single",
 q:"卷扬机作业时，钢丝绳在卷筒上至少应保留（　）。",
 o:["1 圈","2 圈","3 圈","5 圈"],a:2,
 e:"钢丝绳在卷筒上最少保留 3 圈，防止受力时绳头拉脱；跑绳应从卷筒下方引出。"},
{id:"t70",ch:"技术",tag:"起重",type:"single",
 q:"吊索（千斤绳）与水平面的夹角不宜小于（　）。",
 o:["30°","45°","60°","75°"],a:1,
 e:"夹角越小，吊索受力越大，因此与水平面夹角不宜小于 45°，并应保证各吊索受力均衡。"},
{id:"t71",ch:"技术",tag:"起重",type:"single",
 q:"采用绳卡固定钢丝绳时，绳卡数量一般不得少于（　）。",
 o:["2 个","3 个","4 个","6 个"],a:1,
 e:"绳卡数量一般不少于 3 个，且绳卡压板应压在受力绳一侧，间距均匀、方向一致。"},
{id:"t72",ch:"技术",tag:"起重",type:"single",
 q:"选用流动式起重机时，应根据（　）查起重机特性曲线或性能表确定。",
 o:["起重量、吊装幅度、起升高度","设备体积、施工人数、工期","机械价格、油耗、司机数量","场地面积、天气、供电条件"],a:0,
 e:"流动式起重机按所需起重量、吊装幅度和起升高度，在特性曲线上找出工作状态，并校核站位地基承载力。"},
{id:"t73",ch:"技术",tag:"起重",type:"single",
 q:"采用非常规起重设备、方法，且单件起吊重量达到（　）及以上的起重吊装工程，属于超过一定规模的危险性较大的分部分项工程。",
 o:["50kN","100kN","150kN","300kN"],a:1,
 e:"单件起吊重量 100kN（约 10t）及以上且采用非常规起重设备、方法的吊装工程，须编制专项施工方案并组织专家论证。"},
{id:"t74",ch:"技术",tag:"起重",type:"single",
 q:"起重量达到（　）及以上的起重机械安装和拆卸工程，属于超过一定规模的危险性较大的分部分项工程。",
 o:["100kN","200kN","300kN","500kN"],a:2,
 e:"起重量 300kN 及以上，或搭设总高度 200m 及以上，或搭设基础标高在 200m 及以上的起重机械安装拆卸工程。"},
{id:"t75",ch:"技术",tag:"起重",type:"single",
 q:"露天起重吊装作业中，当风力达到（　）时，应停止吊装作业。",
 o:["4 级","5 级","6 级","8 级"],a:2,
 e:"风力 6 级（10.8～13.8m/s）及以上应停止吊装；雨雪、大雾、夜间照明不足时也不得进行吊装作业。"},
{id:"t76",ch:"技术",tag:"起重",type:"single",
 q:"无锚点推吊法的主要优点是（　）。",
 o:["完全不需要起重索具","节省地锚、减少场地占用","适用于超重设备","可显著提高吊装高度"],a:1,
 e:"无锚点推吊法利用设备自身重量与推吊力，省去大量地锚，适用于场地狭窄、地耐力低的重型设备吊装。"},
{id:"t77",ch:"技术",tag:"起重",type:"single",
 q:"旋转法（扳转法）吊装主要适用于（　）。",
 o:["卧式换热器","细高的塔类设备","大跨度屋架","管道支架"],a:1,
 e:"旋转法是将设备下部先置于基础上，绕铰点旋转直立就位，适用于细高塔类等设备。"},
{id:"x28",ch:"技术",tag:"起重",type:"multi",
 q:"下列属于自行式（流动式）起重机的有（　）。",
 o:["汽车式起重机","轮胎式起重机","履带式起重机","塔式起重机"],a:[0,1,2],
 e:"流动式起重机包括汽车式、轮胎式、履带式；塔式起重机属于固定式臂架型起重机。"},
{id:"x29",ch:"技术",tag:"起重",type:"multi",
 q:"起重吊装作业前应检查确认的内容有（　）。",
 o:["站位处地基承载力符合方案要求","吊索具、卸扣、卡环经检查合格","按方案进行试吊并检查受力、制动","为抢工期可先起吊、边吊边设警戒区"],a:[0,1,2],
 e:"吊装前必须确认地基承载、机具完好并试吊检查；警戒区应在起吊前设置完毕，任何情况下都不得边吊边设。"},
{id:"x30",ch:"技术",tag:"起重",type:"multi",

 o:["埋设牢固，回填土应分层夯实","不得利用树木、电杆等代替地锚","与地下管线、电缆保持安全距离","地锚主要承受垂直向上的拉力"],a:[0,1,2],

 as:`1. 原因：①风管系统严密性不合格，漏风带入污染；②高效过滤器与框架密封不良、密封垫破损；③安装前空吹时间不足（应 12～24h），室内未彻底清扫擦拭；④人员、物料未按洁净程序净化进出；⑤过滤器本身受损或安装方向错误。

2. 整改：对风管做漏风（漏光）检测并修补；重新处理过滤器密封、更换破损密封垫；系统空吹 12～24h、全面擦拭；建立人员物料净化制度；检查过滤器箭头方向与外观。

3. 空态、静态、动态。`},
{ch:"技术",t:"案例十一 · 电梯安装与监督检验",
 bg:"某办公楼电梯安装前未办理书面告知；安装完成后由安装单位自行检查即交付使用；使用中发现层门可被强行打开。",
 qs:["1. 指出该工程违反特种设备管理规定的行为。",
     "2. 写出电梯安装的正确程序。",
     "3. 层门门锁应满足什么要求？"],
 as:`1. 违规：①安装前未书面告知特种设备安全监督管理部门；②未经监督检验合格即交付使用。

2. 程序：施工前书面告知→安装施工→安装单位自检→申请监督检验（特种设备检验机构）→检验合格→办理使用登记（投入使用前或后 30 日内）→交付使用。

3. 层门应设置机械锁紧装置和电气联锁装置：层门关闭并锁紧后电梯才能启动；层门未关闭锁紧时电梯不能运行；正常运行时层门不得被从外部强行打开（需专用钥匙）。`},
{ch:"法规",t:"案例十二 · 消防验收与喷头安装",
 bg:"某商场机电安装完成，消防工程尚未验收，商场即开始试营业。检查发现自动喷水喷头在管道试压前已安装，部分喷头被涂刷涂料。",
 qs:["1. 指出建设单位的违规行为及后果。",
     "2. 说明消防验收的组织与程序。",
     "3. 指出喷头安装的错误并改正。"],
 as:`1. 未经消防验收即投入使用属违规。依法应当进行消防验收的建设工程，未经消防验收或验收不合格的，禁止投入使用；可责令停止使用并处罚款。

2. 特殊建设工程由建设单位向住房和城乡建设主管部门申请消防验收，主管部门组织验收并出具验收意见；其他建设工程实行备案抽查。

3. 错误：①喷头在试压前安装——应在管道试压、冲洗合格后安装；②喷头被涂漆——喷头不得涂刷任何涂料，以免影响感温元件动作。还应核对喷头型号、温度等级与保护面积，安装时不得对喷头进行拆装、改动。`},
{ch:"合同",t:"案例十三 · 口头变更与索赔举证",
 bg:"施工中建设单位项目负责人口头要求增加设备基础，承包商随即施工。完工后承包商报送增加费用 8 万元，建设单位以“无书面指令”为由拒付。",
 qs:["1. 建设单位的口头指令是否有效？承包商应如何处置？",
     "2. 承包商索赔能否成立？需要哪些证据？"],
 as:`1. 口头指令原则上不能直接作为计价依据。承包商应在收到口头指令后及时以书面形式请建设单位（监理）确认；建设单位在约定期限内未答复的，可视为确认。未确认即施工存在风险。

2. 索赔可以成立，但须举证。证据包括：变更指令或书面确认文件、施工记录与影像资料、工程量签证、材料与人工费用凭证、会议纪要、往来函件。同时必须在索赔事件发生后 28 天内递交索赔意向通知书，否则可能丧失索赔权。`},
{ch:"试运行",t:"案例十四 · 单机试运行异常处置",
 bg:"某冷冻站单机试运行时，压缩机轴承温度持续升高并超过报警值，操作人员继续运行至跳车。联动试运行由施工单位组织，建设单位未参加。",
 qs:["1. 指出试运行中的不妥之处。",
     "2. 单机试运行应具备哪些条件？",
     "3. 联动试运行应由谁组织？"],
 as:`1. ①轴承温度超限仍继续运行不妥，应立即停机检查，查明原因（润滑不良、装配间隙不当、冷却不足、对中不良）并处理后重新试运行；②联动试运行由施工单位组织不妥。

2. 条件：设备安装完毕、找正找平合格、二次灌浆达到强度；管道试压冲洗合格；电气及仪表调试合格；润滑、冷却、加热系统具备条件；试运行方案已审批、人员机具到位、安全措施落实；单机试运行合格。

3. 联动试运行由建设单位组织，施工单位配合（编制方案、培训操作人员、参加保运）；负荷试运行亦由建设单位组织。`},
{ch:"技术",t:"案例十五 · 不锈钢管道焊接裂纹",
 bg:"某不锈钢工艺管道焊接中，未做焊接工艺评定即开始施焊，部分焊工证件已过期。无损检测发现焊缝存在裂纹。",
 qs:["1. 指出焊接管理中的问题。",
     "2. 裂纹应如何处理？",
     "3. 不锈钢管道焊接还应注意哪些要点？"],
 as:`1. ①未进行焊接工艺评定即施焊；②焊工证件过期仍上岗（中断受监察设备焊接 6 个月以上也应重新考试）；③未编制焊接作业指导书。

2. 裂纹必须彻底清除（打磨或碳弧气刨后修整）至露出金属光泽，经表面检测确认无缺陷后按评定合格的工艺返修；同一部位返修不宜超过 2 次，超次应经技术负责人批准并制定专门措施；返修后重新进行无损检测。

3. 要点：采用氩弧焊打底、控制层间温度；用专用砂轮片加工坡口，不得与碳钢混用；与碳钢支吊架之间加不锈钢或非金属隔离垫；焊后酸洗钝化；水压试验用水氯离子含量不超过 25mg/L。`},
{ch:"技术",t:"案例十六 · 两台吊车抬吊",
 bg:"某工程用 2 台 25t 汽车吊抬吊一台重 15t 的反应器，未编制专项施工方案，现场仅 1 名指挥人员，吊装时一台吊车实际载荷达到额定起重量的 90%。",
 qs:["1. 该吊装是否需编制专项方案并组织专家论证？说明理由。",
     "2. 指出抬吊作业的错误并改正。"],
 as:`1. 需要专项方案且需专家论证。理由：采用非常规起重设备、方法（两台汽车吊抬吊），且单件起吊重量 15t＝150kN≥100kN，属于超过一定规模的危大工程，应组织专家论证（专家 5 名以上）。

2. 错误：①未编制专项方案即吊装；②仅 1 名指挥人员；③一台吊车载荷达额定 90%，超过 80% 限值。
改正：编制并审批专项方案、组织专家论证；设总指挥 1 人、副指挥及信号员，统一指挥、统一信号；每台吊车载荷不得超过额定起重量的 80%；正式起吊前进行试吊（离地 200～300mm），核算地基承载力。`},
{ch:"进度",t:"案例十七 · 非关键工作的延误",
 bg:"某机电工程网络计划中，D 工作总时差 10 天，因材料供应延误 12 天；关键工作 E 因设计变更延误 6 天。两项延误均非承包商原因，且均在规定时限内提出索赔。",
 qs:["1. 分别说明两项延误对总工期的影响。",
     "2. 承包商可索赔工期共多少天？"],
 as:`1. D 为非关键工作，总时差 10 天，延误 12 天超出总时差 2 天，使总工期延长 2 天；E 为关键工作，总时差为 0，延误 6 天使总工期延长 6 天。

2. 两项延误位于不同线路，可索赔工期＝2＋6＝8 天；若在同一线路上叠加，则按叠加后的总延长计算。计算时应绘制调整后的网络计划，重新确定关键线路和计算工期，避免重复计算。`},
{ch:"验收",t:"案例十八 · 竣工验收与资料",
 bg:"某机电工程完工，施工单位仅提交了部分施工记录，建设单位要求“先验收、资料后补”。验收时发现设计变更未办理手续、消防未验收。",
 qs:["1. 指出验收组织中的不妥之处。",
     "2. 单位工程竣工验收应具备哪些条件？",
     "3. 竣工资料主要包括哪些内容？"],
 as:`1. ①“先验收、资料后补”不妥，资料应完整齐全；②设计变更未办理手续即施工不妥，应补齐变更程序；③消防未验收即组织竣工验收不妥，应先通过消防验收。

2. 条件：完成设计和合同约定的各项内容；工程资料完整；有施工单位签署的工程质量合格文件；有监理单位签署的工程验收报告；消防、环保等专项验收合格；具备使用条件。

3. 主要包括：施工管理资料（开工报告、施工组织设计、技术交底）、施工技术资料（图纸会审、设计变更、洽商记录）、物资资料（合格证、复试报告）、施工记录与检测报告（隐蔽验收、试压、试运行、调试记录）、竣工图、工程质量验收记录。`},
{ch:"技术",t:"案例十九 · 变配电室送电",
 bg:"某变配电室设备安装完毕，送电前未做交接试验，测得部分回路绝缘电阻不合格，但为赶工期仍强行送电；送电操作由施工班组自行进行，未办理工作票。",
 qs:["1. 指出送电过程中的错误。",
     "2. 送电应具备哪些条件？",
     "3. 电气交接试验主要包括哪些内容？"],
 as:`1. 错误：①未做交接试验即送电；②绝缘电阻不合格仍强行送电；③未办理工作票、未统一指挥，由施工班组自行操作。

2. 条件：设备安装及接线完毕并检查合格；交接试验全部合格；绝缘电阻符合要求；继电保护整定完毕并校验合格；送电方案已审批；组织分工明确、统一指挥；办理工作票、设置警戒、配备绝缘用具和消防器材；通知相关单位。

3. 主要包括：绝缘电阻测量、交流耐压试验、直流耐压及泄漏电流测量、继电保护装置整定与校验、互感器变比与极性检查、接地电阻测量、断路器机械特性试验等。`},
{ch:"综合",t:"案例二十 · 高处坠落事故",
 bg:"某机电工程施工现场，一名作业人员从 4m 高的操作平台坠落身亡。调查发现：作业人员未系安全带；平台临边无防护栏杆；脚手架未经验收即使用；班前未进行安全交底。",
 qs:["1. 该事故属于哪个等级？依据是什么？",
     "2. 事故报告的程序和时限是什么？",
     "3. 提出防止同类事故的措施。"],
 as:`1. 一般事故。依据：死亡 3 人以下属于一般事故（较大事故为死亡 3 人以上 10 人以下）。

2. 事故发生后，现场人员应立即向本单位负责人报告；单位负责人接到报告后 1 小时内向县级以上人民政府应急管理部门和负有安全生产监督管理职责的部门报告；情况紧急时，现场人员可直接报告。不得迟报、漏报、谎报或瞒报。

3. 措施：①高处作业必须系挂安全带、设置临边防护栏杆和安全网；②脚手架搭设后经验收合格挂牌使用；③严格执行班前安全交底和安全教育；④特种作业人员持证上岗；⑤开展隐患排查治理，落实安全生产责任制；⑥配备合格劳动防护用品并监督使用。`},
{ch:"通风空调",t:"案例二十一 · 风管安装质量检查",
 bg:"某商场通风空调工程，监理巡视发现：①矩形风管边长 800mm、管段长度 1500mm，未采取加固措施；②防火阀距防火墙表面 350mm；③风机出口与风管采用法兰直接硬连接；④冷凝水管道坡度 5‰。",
 qs:["逐条指出上述做法的不妥之处并改正。"],
 as:`1. 风管未加固不妥。边长 800mm＞630mm 且管段长度 1500mm＞1250mm，应采取加固措施（加固框、压筋或管内支撑）。

2. 防火阀距墙 350mm 不妥。距防火墙表面不应大于 200mm，并应设独立支吊架，易熔件朝向气流方向。

3. 风机与风管法兰硬连接不妥。应采用柔性短管（长度 150～300mm），且不得扭曲、憋劲。

4. 冷凝水坡度 5‰ 不妥。坡度不应小于 8‰，且不得与其它排水管直接连接。`},
{ch:"通风空调",t:"案例二十二 · 风量调试不合格",
 bg:"某通风空调系统调试时测得：总风量实测值为设计值的 88%；某风口风量实测值比设计值大 18%；室内温度达到设计要求。",
 qs:["1. 总风量和单个风口风量是否合格？说明理由。",
     "2. 应采取什么处理措施？"],
 as:`1. 总风量不合格：实测 88%，偏差 12%，超过允许的 10%。
该风口不合格：偏差 18%，超过允许的 15%。
室内温度合格，但不影响前两项判定。

2. 处理措施：①检查风机转向、转速、皮带松紧、阀门开度，风管是否漏风或堵塞；②调整各分支风阀，重新进行风量平衡；③调整后重新测定，直至总风量偏差≤10%、各风口≤15%；④复测合格后填写调试记录，再进入联动试运转及室内参数测定。`},
{ch:"技术+安全",t:"案例二十三 · 起重机械选型与地锚设置",
 bg:"某化工厂新建装置区安装 3 台塔器，单台重 60t、高 28m。因北侧紧邻地下管廊、场地狭窄，汽车吊无法站位，项目部改用人字桅杆吊装（非常规起重设备）。方案要点：①桅杆设缆风绳 4 根，与地面夹角 20°，就近固定在厂区树木和电杆上；②地锚采用活动式地锚，埋深 1.2m；③方案经项目部技术负责人审批后即组织实施；④起吊前未进行试吊，直接起吊；⑤作业当天天气预报风力 6 级，现场仍继续吊装。另，项目部曾考虑用 2 台 25t 汽车式起重机抬吊该塔器。",
 qs:["1. 指出方案中的不妥之处，并写出正确做法。",
     "2. 该吊装工程是否需要专家论证？说明理由及专项方案的审批程序。",
     "3. 若采用 2 台 25t 汽车吊抬吊 60t 塔器是否可行？列式计算说明。",
     "4. 地锚设置应符合哪些要求？"],
 as:`1. 不妥及正确做法：
（1）缆风绳与地面夹角 20° 不妥。应取 30°~45°，夹角过小拉力剧增、地锚受力过大。
（2）缆风绳仅 4 根不妥。桅杆缆风绳不得少于 6 根，且应对称布置。
（3）缆风绳固定在树木、电杆上不妥。严禁利用树木、电杆、建筑物代替地锚，应设专门地锚。
（4）活动式地锚、埋深 1.2m 不妥。60t 重型塔器应设全埋式地锚，按受力计算确定尺寸与埋深，回填分层夯实；地锚还应避开北侧地下管廊并保持安全距离。
（5）仅由项目部技术负责人审批不妥。应由施工单位技术负责人审核签字并加盖单位公章，报总监理工程师审查签字并加盖执业印章。
（6）未试吊直接起吊不妥。应吊离地面 200~300mm 停留检查受力、变形、制动和绑扎情况，确认无误后正式起吊。
（7）风力 6 级继续吊装不妥。风力 6 级及以上应停止吊装作业，雨雪、大雾、照明不足时同样不得吊装。

2. 需要专家论证。理由：采用非常规起重设备（人字桅杆），且单件起吊重量 60t＝600kN≥100kN，属于超过一定规模的危险性较大的分部分项工程。
审批程序：施工单位编制专项施工方案→施工单位技术负责人审核签字、加盖单位公章→总监理工程师审查签字并加盖执业印章→施工单位组织专家论证（专家 5 名以上、从专家库抽取，参建各方人员不得以专家身份参加）→按论证意见修改→重新审批后实施，并组织验收。

3. 不可行。计算：
（1）两台抬吊时单台分配载荷＝60÷2＝30t。
（2）计入动载系数 1.1、不均衡载荷系数 1.1：Qj＝1.1×1.1×60＝72.6t，单台约 36.3t。
（3）多机抬吊时每台载荷不得超过其额定起重量的 80%，即 25×80%＝20t＜30t（更远小于 36.3t）。
两台合计能力 2×20＝40t＜60t，故不可行，应选用更大吨位起重机或改用桅杆等其他吊装方法。

4. 地锚设置要求：
（1）按受力计算确定形式、尺寸和埋深，重型设备吊装宜采用全埋式地锚；
（2）埋设处回填土应分层夯实，不得用松填土代替原状土；
（3）位置应避开地下管线、电缆及构筑物，并保持安全距离；
（4）钢丝绳与地锚连接牢固，采用绳卡固定时不少于 3 个，压板压在受力绳一侧；
（5）严禁利用树木、电杆、建筑物或设备基础代替地锚；
（6）受力前应检查并试拉，确认无位移、无松动后方可正式使用。`},
{ch:"技术+管理",t:"案例二十四 · 吊装方案编制与地基承载力验算",
 bg:"某机电安装工程需将一根重 40t 的桥式起重机主梁吊装就位，标高 18m。因单机能力不足，采用 2 台 100t 汽车式起重机抬吊。站位处为回填土场地，实测地基承载力特征值 90kPa。方案由项目部技术员编制后直接交班组执行，未做地基承载力验算，仅在支腿下垫设 1.2m×1.2m 钢板；吊装前未进行安全技术交底，也未试吊。施工中实测单支腿最大反力为 35t。",
 qs:["1. 验算支腿处地基承载力是否满足要求（钢板尺寸 1.2m×1.2m，取 1t＝10kN）。",
     "2. 指出吊装方案编制与审批中的不妥之处，并说明正确做法。该工程是否需要专家论证？",
     "3. 地基不满足要求时，可采取哪些处理措施？",
     "4. 吊装作业前还应完成哪些准备工作？"],
 as:`1. 计算：
单支腿反力 F＝35t×10kN/t＝350kN；
钢板承压面积 A＝1.2×1.2＝1.44m²；
支腿处地基实际承受压力 p＝F/A＝350/1.44≈243kPa。
243kPa＞90kPa，地基承载力不满足要求，必须处理后方可吊装。

2. 不妥之处：
（1）由项目部技术员编制、直接交班组执行不妥。专项施工方案应由施工单位技术人员编制，经施工单位技术负责人审核签字、加盖单位公章，报总监理工程师审查签字并加盖执业印章后方可实施。
（2）未做地基承载力验算即确定站位不妥。流动式起重机站位必须验算地基承载力，并按支腿反力和垫板面积核算承压应力。
（3）未进行安全技术交底、未试吊即作业不妥。作业前应分级交底并签字确认；起吊前应进行试吊，吊离地面 200~300mm 停留检查。
需要专家论证。理由：采用两台起重机抬吊，属非常规起重方法，且单件起吊重量 40t＝400kN≥100kN，属于超过一定规模的危险性较大的分部分项工程，应组织专家论证（专家 5 名以上，从专家库抽取，参建各方人员不得以专家身份参加）。

3. 地基处理措施：
（1）换填：挖除软弱回填土，换填级配砂石或灰土，分层夯实至设计承载力；
（2）扩大承压面积：铺设路基箱、厚钢板、枕木垛或浇筑混凝土支墩，将支腿反力扩散到更大面积；
（3）排水：设置排水沟、集水井，避免积水浸泡地基；
（4）加固：必要时采用夯实、注浆、桩基等加固措施；
（5）复核：处理后重新检测地基承载力，合格后方可吊装；仍不满足时应改变站位或改用履带式起重机等接地面积更大的机型。
处理方案应经计算确定并留存验算资料。

4. 作业前准备：
（1）专项方案编制、审核、审批（超规模的组织专家论证）并交底；
（2）核对设备重量、外形、重心与吊点，复核起重机工况（幅度、起重量、起升高度）；
（3）检查起重机安全装置（力矩限制器、限位器、制动器）及吊索具、卸扣、卡环；
（4）确认地基处理合格并铺设垫板、路基箱；
（5）特种作业人员持证上岗，明确统一指挥信号；
（6）设置警戒区并派专人监护，办理吊装作业许可；
（7）确认天气（风力 6 级及以上停止）与照明条件；
（8）进行试吊，确认无误后正式起吊。`},
{ch:"技术",t:"案例二十五 · 吊索受力与钢丝绳选用计算",
 bg:"某设备重 20t，采用 4 根吊索对称绑扎吊装，吊索与水平面夹角 45°。选用钢丝绳的破断拉力总和为 500kN，吊索安全系数取 6。施工中为降低吊装高度，有人提议将吊索与水平面夹角改为 30°。",
 qs:["1. 计算单根吊索受力，并验算所选钢丝绳是否满足要求（取 1t＝10kN，结果保留一位小数）。",
     "2. 若夹角改为 30°，重新验算是否满足要求，并说明原因。",
     "3. 提高吊索安全性的措施有哪些？"],
 as:`1. 计算：
设备重力 Q＝20t×10kN/t＝200kN。
单根吊索的垂直分力＝200÷4＝50kN。
单根吊索受力 T＝50÷sin45°＝50÷0.707≈70.7kN。
所需破断拉力≥T×K＝70.7×6≈424kN。
所选钢丝绳破断拉力 500kN＞424kN，满足要求。

2. 夹角改为 30° 时：
T＝50÷sin30°＝50÷0.5＝100kN；
所需破断拉力＝100×6＝600kN＞500kN，不满足要求。
原因：吊索与水平面夹角越小，其垂直分力占拉力的比例越小，为平衡同样的重力，索力必然增大。夹角由 45° 降到 30°，索力由 70.7kN 增至 100kN，增大约 41%，故不能随意减小夹角。

3. 提高吊索安全性的措施：
（1）增大吊索与水平面夹角，一般不宜小于 45°；
（2）增加吊索根数，使每根受力减小；
（3）选用破断拉力更大的钢丝绳（加大直径或提高公称抗拉强度）；
（4）采用平衡梁（扁担梁）吊装，使吊索基本处于垂直受力状态；
（5）保证各吊索长度一致、受力均衡，绑扎处加护角防止割伤；
（6）使用前检查钢丝绳断丝、磨损、锈蚀情况，绳卡不少于 3 个且压板压在受力绳一侧。`},
{ch:"技术+法规",t:"案例二十六 · 起重机械安装、拆卸与监督检验",

 as:`1. 不妥之处及改正：

/* ============ 状态与存储 ============ */
const KEY="yjjd.v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
let DB=load();
DB.ans=DB.ans||{}; DB.wrong=DB.wrong||[]; DB.days=DB.days||{};
DB.exam=DB.exam||"2027-09-18";

const S={tab:"practice",ch:"全部",tag:"全部",mode:"all",qi:0,picked:[],done:false,cidx:0,flip:false};
/* 恢复上次停留的位置（页面被系统回收后重开也能接着做） */
(function restoreUI(){
  const u=DB.ui||{};
  if(u.tab) S.tab=u.tab;
  if(u.ch) S.ch=u.ch;
  if(u.tag) S.tag=u.tag;
  if(u.mode) S.mode=u.mode;
  if(typeof u.qi==="number") S.qi=u.qi;
  if(typeof u.cidx==="number") S.cidx=u.cidx;
})();
function saveUI(){DB.ui={tab:S.tab,ch:S.ch,tag:S.tag,mode:S.mode,qi:S.qi,cidx:S.cidx};save()}

const CHS=["全部","技术","管理","法规","通风空调"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function markDay(){DB.days[todayKey()]=1;save()}

function pool(){
  if(S.mode==="wrong"){
    const set=new Set(DB.wrong);
    return BANK.filter(q=>set.has(q.id));
  }
  let list = S.ch==="全部"?BANK:BANK.filter(q=>q.ch===S.ch);
  if(S.tag&&S.tag!=="全部") list=list.filter(q=>q.tag===S.tag);
  return list;
}
function tagOptions(){
  if(S.ch==="全部") return [];
  const base=BANK.filter(q=>q.ch===S.ch);
  const cnt={};
  base.forEach(q=>{if(q.tag) cnt[q.tag]=(cnt[q.tag]||0)+1});
  return ["全部",...Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])];
}
function cur(){const p=pool();return p[Math.min(S.qi,p.length-1)]}

function countdown(){
  const t=new Date(DB.exam+"T00:00:00").getTime()-Date.now();
  const d=Math.ceil(t/86400000);
  return d>0?d:0;
}

/* ============ 视图 ============ */
function viewPractice(){
  const p=pool();
  if(!p.length) return `<div class="empty">这里还没有题目<br>去做几道题，错题会自动收集到这里</div>`;
  const q=cur();
  const idx=p.findIndex(x=>x.id===q.id);
  const answered=p.filter(x=>DB.ans[x.id]).length;
  const pct=Math.round(answered/p.length*100);

  let opts="";
  q.o.forEach((text,i)=>{
    let cls="opt";
    if(S.done){
      if(q.type==="multi"){
        if(q.a.includes(i)) cls+=" ok";
        else if(S.picked.includes(i)) cls+=" bad";
      }else{
        if(i===q.a) cls+=" ok";
        else if(S.picked.includes(i)) cls+=" bad";
      }
    }else if(S.picked.includes(i)) cls+=" sel";
    opts+=`<button class="${cls}" data-act="opt" data-i="${i}">
      <span class="k">${"ABCD"[i]}</span><span>${esc(text)}</span></button>`;
  });

  const canSubmit=q.type==="multi"&&!S.done&&S.picked.length>0;
  const btn=S.done
    ? `<button class="btn" data-act="next">下一题 →</button>`
    : (q.type==="multi"
        ? `<button class="btn" data-act="submit" ${canSubmit?"":"disabled"}>提交答案</button>`
        : `<div class="muted" style="text-align:center;padding:6px">点击选项作答，单选即时判分</div>`);

  const exp=S.done?`<div class="exp"><b>解析：</b>${esc(q.e)}</div>`:"";
  let fb="";
  if(S.done){
    const right=q.type==="multi"
      ? (S.picked.length===q.a.length&&S.picked.every(i=>q.a.includes(i)))
      : (S.picked[0]===q.a);
    const ansText=q.type==="multi"?q.a.map(i=>"ABCD"[i]).join(""):"ABCD"[q.a];
    fb=`<div class="${right?"fb-ok":"fb-bad"}">${right?"✓ 答对了":"✗ 答错了，正确答案 "+ansText}</div>`;
  }

  return `
  <div class="seg">${CHS.map(c=>`<button class="${S.ch===c&&S.mode==="all"?"on":""}" data-act="ch" data-v="${c}">${c}</button>`).join("")}</div>
  ${tagOptions().length?`<div class="seg" style="flex-wrap:wrap;margin-top:-4px">${tagOptions().map(t=>`<button style="flex:0 0 auto;padding:5px 9px;font-size:11.5px" class="${S.tag===t&&S.mode==="all"?"on":""}" data-act="tag" data-v="${t}">${t}</button>`).join("")}</div>`:""}
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="muted" style="display:flex;justify-content:space-between;margin-bottom:12px">
    <span>${S.mode==="wrong"?"错题重做":S.ch+"练习"}</span><span>${idx+1} / ${p.length}　已答 ${answered}</span>
  </div>
  <div class="card">
    <div class="qtag">${q.ch} · ${q.tag||""} · ${q.type==="multi"?"多选题":"单选题"}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${opts}
    ${fb}
    ${exp}
    <div style="margin-top:14px">${btn}</div>
  </div>`;
}

function viewCards(){
  const c=CARDS[S.cidx];
  return `
  <div class="muted" style="display:flex;justify-content:space-between;margin-bottom:10px">
    <span>${c.ch}　点击卡片翻面</span><span>${S.cidx+1} / ${CARDS.length}</span>
  </div>
  <div class="flash" data-act="flip">
    <div class="ft">${S.flip?"答案":"考点"}</div>
    <div class="fq">${esc(S.flip?c.b:c.f)}</div>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn ghost" data-act="prev" style="flex:1">← 上一张</button>
    <button class="btn ghost" data-act="nextc" style="flex:1">下一张 →</button>
  </div>`;
}

function viewWrong(){
  if(!DB.wrong.length) return `<div class="empty">暂无错题<br>答错的题会自动收进来</div>`;
  const items=DB.wrong.map(id=>BANK.find(q=>q.id===id)).filter(Boolean);
  return `
  <div class="muted" style="margin-bottom:10px">共 ${items.length} 道错题</div>
  <div class="list">
    ${items.map(q=>`<div class="item">
      <h3>${esc(q.q)}</h3>
      <div class="muted">正确答案：${q.type==="multi"?q.a.map(i=>"ABCD"[i]).join(""):"ABCD"[q.a]}</div>
      <details><summary>查看解析</summary><div class="ansbox">${esc(q.e)}</div></details>
    </div>`).join("")}
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn" data-act="redo" style="flex:1">重做错题</button>
    <button class="btn ghost" data-act="clearwrong" style="width:110px">清空</button>
  </div>`;
}

function viewCases(){
  return `
  <div class="muted" style="margin-bottom:10px">共 ${CASES.length} 个案例，先自己写在纸上，再展开对照</div>
  <div class="list">
    ${CASES.map((c,i)=>`<div class="item">
      <div class="qtag" style="margin-bottom:6px">${c.ch}</div>
      <h3>${esc(c.t)}</h3>
      <div class="case-q">${esc(c.bg)}</div>
      <div class="case-q" style="margin-top:10px;color:#9ff0c8">【问题】</div>
      <div class="case-q">${esc(c.qs.join("\n"))}</div>
      <details><summary>展开参考答案</summary><div class="ansbox">${esc(c.as)}</div></details>
    </div>`).join("")}
  </div>`;
}

function viewMe(){
  const total=BANK.length, done=Object.keys(DB.ans).length;
  const ok=Object.values(DB.ans).filter(x=>x.ok).length;
  const rate=done?Math.round(ok/done*100):0;
  const streak=Object.keys(DB.days).length;
  const byCh=CHS.slice(1).map(c=>{
    const qs=BANK.filter(q=>q.ch===c);
    const d=qs.filter(q=>DB.ans[q.id]).length;
    const r=d?Math.round(qs.filter(q=>DB.ans[q.id]&&DB.ans[q.id].ok).length/d*100):0;
    return `<div style="margin-bottom:12px">
      <div class="muted" style="display:flex;justify-content:space-between">${c}<span>${d}/${qs.length}　正确率 ${r}%</span></div>
      <div class="bar"><i style="width:${qs.length?d/qs.length*100:0}%"></i></div></div>`;
  }).join("");

  return `
  <div class="stat" style="margin-bottom:12px">
    <div><span>已做题</span><b>${done}</b></div>
    <div><span>正确率</span><b>${rate}%</b></div>
    <div><span>错题</span><b>${DB.wrong.length}</b></div>
    <div><span>学习天数</span><b>${streak}</b></div>
  </div>
  <div class="card">${byCh}</div>
  <div class="card">
    <div class="muted" style="margin-bottom:8px">考试日期（用于倒计时）</div>
    <input type="date" id="examDate" value="${DB.exam}">
    <div class="muted" style="margin-top:10px;line-height:1.7">题库共 ${total} 题、${CARDS.length} 张卡片、${CASES.length} 个案例，<b style="color:#7dd3fc">全部为《机电工程管理与实务》内容</b>：技术＝1H410000，管理＝1H420000，法规＝1H430000（教材三篇，不是公共科目）；「通风空调」为技术篇专项分类。数据仅存本机 Safari。</div>
  </div>
  <button class="btn ghost" data-act="reset">清空全部学习记录</button>
  <div class="muted" style="text-align:center;margin-top:18px;font-size:12px">题目为备考自编，正式复习请以最新版教材为准</div>`;
}

/* ============ 渲染 ============ */
function render(keepScroll){
  let html="";
  if(S.tab==="practice") html=viewPractice();
  else if(S.tab==="cards") html=viewCards();
  else if(S.tab==="cases") html=viewCases();
  else if(S.tab==="wrong") html=viewWrong();
  else html=viewMe();
  const keepY=$("#view").scrollTop;
  $("#view").innerHTML=html;
  $("#cd").textContent=countdown();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  $("#view").scrollTop=keepScroll?keepY:0;
  if(keepScroll){
    const v=$("#view"), y=keepY;
    requestAnimationFrame(()=>{ v.scrollTop=y; requestAnimationFrame(()=>{ v.scrollTop=y }) });
  }
  saveUI();
}

/* ============ 交互 ============ */
document.addEventListener("click",e=>{
  const navBtn=e.target.closest("#nav button");
  if(navBtn){S.tab=navBtn.dataset.tab;render();return}

  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act;

  if(act==="ch"){S.ch=el.dataset.v;S.tag="全部";S.mode="all";S.qi=0;S.picked=[];S.done=false;render();return}

  if(act==="tag"){S.tag=el.dataset.v;S.mode="all";S.qi=0;S.picked=[];S.done=false;render();return}

  if(act==="opt"){
    if(S.done) return;
    const i=Number(el.dataset.i);
    const q=cur();
    if(q.type==="multi"){
      S.picked.includes(i)?S.picked=S.picked.filter(x=>x!==i):S.picked.push(i);
      render(true);
    }else{
      S.picked=[i];S.done=true;judge(q);render(true);revealAnswer();
    }
    return;
  }
  if(act==="submit"){const q=cur();S.done=true;judge(q);render(true);revealAnswer();return}
  if(act==="next"){
    if(S.toRemove){DB.wrong=DB.wrong.filter(x=>x!==S.toRemove);S.toRemove=null;save()}
    const p=pool();
    S.qi=(S.qi+1)%p.length;S.picked=[];S.done=false;render();return;
  }
  if(act==="flip"){S.flip=!S.flip;render();return}
  if(act==="prev"){S.cidx=(S.cidx-1+CARDS.length)%CARDS.length;S.flip=false;render();return}
  if(act==="nextc"){S.cidx=(S.cidx+1)%CARDS.length;S.flip=false;render();return}
  if(act==="redo"){S.mode="wrong";S.qi=0;S.picked=[];S.done=false;S.tab="practice";render();return}
  if(act==="clearwrong"){if(confirm("清空错题本？")){DB.wrong=[];save();render()}return}
  if(act==="reset"){if(confirm("清空全部记录？错题和统计都会消失")){DB={ans:{},wrong:[],days:{},exam:DB.exam};save();render()}return}
});

document.addEventListener("change",e=>{
  if(e.target.id==="examDate"){DB.exam=e.target.value||"2027-09-18";save();render()}
});

function revealAnswer(){
  const fb=document.querySelector(".fb-ok,.fb-bad");
  if(fb&&fb.scrollIntoView) fb.scrollIntoView({block:"nearest"});
}

function judge(q){
  const ok=q.type==="multi"
    ? (S.picked.length===q.a.length && S.picked.every(i=>q.a.includes(i)))
    : (S.picked[0]===q.a);
  DB.ans[q.id]={ok:ok,t:Date.now()};
  if(!ok && !DB.wrong.includes(q.id)) DB.wrong.push(q.id);
  if(ok){
    if(S.mode==="wrong"){S.toRemove=q.id}
    else{DB.wrong=DB.wrong.filter(x=>x!==q.id)}
  }
  markDay();save();
}

/* 启动 */
render();
</script>
</body>
</html>
